<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>खर्चप्रबंधक — आर्थिक उद्दिष्टे</title><link rel="stylesheet" href="/ui.css"></head><body><main class="page"><section class="page-head"><div><span class="eyebrow">दीर्घकालीन नियोजन</span><h1>आर्थिक उद्दिष्टे</h1><p>तुमची उद्दिष्टे ठरवा, प्राधान्य द्या आणि प्रगतीचा मागोवा घ्या.</p></div></section><div class="grid grid-2"><article class="card"><div class="section-head"><div><h2>नवीन आर्थिक उद्दिष्ट</h2><p>उद्दिष्टाची रक्कम, तारीख आणि प्राधान्य निश्चित करा.</p></div></div><form id="goalForm" class="stack"><div class="field"><label for="goalName">उद्दिष्टाचे नाव</label><input type="text" id="goalName" placeholder="उदा. आपत्कालीन निधी" required></div><div class="field"><label for="goalAmount">उद्दिष्टाची रक्कम (₹)</label><input type="number" id="goalAmount" min="0" step="1" placeholder="उदा. 100000" required></div><div class="field"><label for="goalDate">उद्दिष्टाची तारीख</label><input type="date" id="goalDate"></div><div class="field"><label for="goalPriority">प्राधान्य</label><select id="goalPriority"><option value="low">कमी</option><option value="medium" selected>मध्यम</option><option value="high">उच्च</option></select></div><div class="field"><label for="goalDescription">विवरण</label><textarea id="goalDescription" rows="3" placeholder="उद्दिष्टाबद्दल थोडक्यात माहिती"></textarea></div><button class="btn btn-primary" type="submit">＋ उद्दिष्ट जतन करा</button></form></article><article class="card"><div class="section-head"><div><h2>आपली उद्दिष्टे</h2><p>प्रगती आणि प्राधान्याचा आढावा.</p></div></div><div id="goalsList" class="grid grid-2"></div></article></div></main><footer>© २०२६ खर्चप्रबंधक • आजची बचत, उद्याचे उद्दिष्ट</footer><script src="/goals.js"></script><script src="/common-ui.js"></script></body></html>
