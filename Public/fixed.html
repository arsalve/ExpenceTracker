<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>खर्चप्रबंधक — नियत खर्च व बचत</title><link rel="stylesheet" href="/ui.css"></head><body><main class="page"><section class="page-head"><div><span class="eyebrow">स्वयंचलित नियोजन</span><h1>नियत खर्च / बचत</h1><p>दर महिन्याला पुन्हा होणारे खर्च किंवा बचत नोंदवा.</p></div><div class="field" style="min-width:210px"><label for="themeSelect">दृश्य पद्धत</label><select id="themeSelect"><option value="auto">हवामान / ऋतुनुसार</option><option value="theme-dark">गडद</option><option value="theme-light">फिकट</option><option value="theme-monsoon">पावसाळा</option><option value="theme-summer">उन्हाळा</option><option value="theme-winter">हिवाळा</option></select></div></section><section class="grid grid-2"><article class="card"><div class="section-head"><div><h2>नियत नोंद जोडा</h2><p>दर महिन्याला लागू होणारी रक्कम सेट करा.</p></div></div><form id="fixedForm" class="stack"><div class="field"><label for="type">प्रकार</label><select id="type" required><option value="debit">खर्च</option><option value="Savings">बचत</option></select></div><div class="field"><label for="description">तपशील</label><input type="text" id="description" placeholder="उदा. घरभाडे / SIP" required></div><div class="field"><label for="amount">रक्कम</label><input type="number" id="amount" min="0" step="1" placeholder="उदा. 15000" required></div><button class="btn btn-primary" type="submit">＋ नियत नोंद जतन करा</button></form></article><article class="card"><div class="section-head"><div><h2>सध्याच्या नियत नोंदी</h2><p>दर महिन्याच्या नियोजनाचा आढावा.</p></div></div><div id="fixedList" class="stack"></div></article></section></main><footer>© २०२६ खर्चप्रबंधक • नियोजन स्वयंचलित करा</footer><script src="/fixed.js"></script><script src="/common-ui.js"></script></body></html>
