<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>खर्चप्रबंधक — अंदाजपत्रक</title><link rel="stylesheet" href="/ui.css"></head><body><main class="page"><section class="page-head"><div><span class="eyebrow">आर्थिक नियोजन</span><h1>अंदाजपत्रक</h1><p>महिन्याचा खर्च मर्यादेत ठेवण्यासाठी श्रेणीनुसार नियोजन करा.</p></div></section><div class="grid grid-2"><article class="card"><div class="section-head"><div><h2>नवीन अंदाजपत्रक</h2><p>एका श्रेणीसाठी खर्च मर्यादा आणि सूचना मर्यादा सेट करा.</p></div></div><form id="budgetForm" class="stack"><div class="field"><label for="budgetCategory">श्रेणी</label><select id="budgetCategory" required><option value="">-- निवडा --</option><option value="Food">अन्न व किराणा</option><option value="Fuel">इंधन</option><option value="Entertainment">मनोरंजन</option><option value="Healthcare">आरोग्य</option><option value="Other">इतर</option></select></div><div class="field"><label for="budgetLimit">अंदाजपत्रक मर्यादा (₹)</label><input type="number" id="budgetLimit" min="0" step="1" placeholder="उदा. 15000" required></div><div class="field"><label for="budgetAlert">सूचना मर्यादा (%)</label><input type="number" id="budgetAlert" value="80" min="1" max="100"></div><button class="btn btn-primary" type="submit">＋ अंदाजपत्रक जतन करा</button></form></article><article class="card"><div class="section-head"><div><h2>आपले अंदाजपत्रक</h2><p>सध्याची श्रेणीवार मर्यादा आणि प्रगती.</p></div></div><div id="budgetList" class="grid grid-2"></div></article></div></main><footer>© २०२६ खर्चप्रबंधक • शिस्तबद्ध खर्च, चांगले नियोजन</footer><script src="/budgets.js"></script><script src="/common-ui.js"></script></body></html>
